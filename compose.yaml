services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - omniflow-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omniflow-data:
