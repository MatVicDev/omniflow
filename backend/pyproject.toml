[project]
name = "omniflow-api"
version = "1.0.0"
description = "OmniFlow — plataforma omnichannel de atendimento com agentes de IA"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"app/seed_data.py" = ["E501"]
